services:
  db:
    image: mysql:8.4
    container_name: error_report_web_db
    restart: always
    volumes:
      - data:/var/lib/mysql
    env_file:
      - .env.dev.db
    ports:
      - "3306:3306"
    healthcheck:
      # TCP: MySQL's init-time server only listens on the socket.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      timeout: 20s
      retries: 10
  
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: error_report_web_backend
    command: sh -c "python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && gunicorn project.wsgi --bind=:8000 --workers=4 --timeout=60"
    restart: always
    volumes:
      - static:/app/staticfiles
    env_file:
      - .env.dev.app
    depends_on:
      db:
         condition: service_healthy

  web:
    image: nginx:1.30
    container_name: error_report_web_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
volumes:
  data:
  static:
