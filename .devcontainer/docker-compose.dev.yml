# Devcontainer override for docker-compose.yaml: runserver on the mounted
# workspace, MariaDB port unpublished (no clash with other dev DBs), no nginx.
services:
  backend:
    command: ["python3", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: "no"
    volumes:
      - .:/app:cached

  db:
    restart: "no"
    ports: !reset []

  web:
    profiles: [nginx]
