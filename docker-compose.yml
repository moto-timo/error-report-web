  errorsstatic:
  logvolume:
  certbotwww:

secrets:
  secret_key:
    file: ./secrets/secret_key.txt
  db_root_pass:
    file: ./secrets/db_root_pass.txt
  db_user_pass:
    file: ./secrets/db_user_pass.txt
  rmq_default_pass:
    file: ./secrets/rmq_default_pass.txt
  email_pass:
    file: ./secrets/email_pass.txt
